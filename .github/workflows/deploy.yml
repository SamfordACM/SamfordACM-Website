name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets any officer redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # TEMPORARY: mirrors npm's failure into an annotation so the error is
      # readable without repo admin rights. Revert to `- run: npm ci` once the
      # install is green.
      - name: Install dependencies
        run: |
          set -o pipefail
          if ! npm ci 2>&1 | tee /tmp/npm-ci.log; then
            echo "::error title=npm ci head::$(head -c 2000 /tmp/npm-ci.log | tr '\n' '~')"
            exit 1
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
